
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160f20">
<title>Violetas</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 overflow:hidden;
 display:grid;
 place-items:center;
 background:
 radial-gradient(ellipse at 50% 40%,#493052 0%,#24162f 45%,#100b18 100%);
 font-family:Georgia,serif;
}

.stars{
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:
 radial-gradient(1px 1px at 15% 20%,#fff 98%,transparent),
 radial-gradient(1px 1px at 80% 15%,#e9d8ff 98%,transparent),
 radial-gradient(1px 1px at 75% 75%,#fff 98%,transparent),
 radial-gradient(1px 1px at 25% 70%,#fff 98%,transparent),
 radial-gradient(1px 1px at 50% 10%,#fff 98%,transparent);
 opacity:.65;
 animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
 to{opacity:.2}
}

main{
 position:relative;
 width:100%;
 height:100vh;
 display:grid;
 place-items:center;
}

.intro{
 position:absolute;
 z-index:3;
 transition:1s;
}

.seal{
 width:85px;
 height:85px;
 border-radius:50%;
 border:1px solid #d9b9e8;
 background:#ffffff0b;
 color:#e7c9f5;
 font-size:35px;
 cursor:pointer;
 box-shadow:0 0 35px #bd8ede55;
 animation:pulse 2.5s infinite;
}

@keyframes pulse{
 50%{
  transform:scale(1.09);
  box-shadow:0 0 55px #bd8ede88;
 }
}

.garden{
 position:absolute;
 width:min(95vw,520px);
 opacity:0;
 transform:translateY(25px) scale(.9);
 transition:1.5s cubic-bezier(.2,.8,.2,1);
}

.garden svg{
 width:100%;
 height:auto;
}

.opened .intro{
 opacity:0;
 transform:scale(.5);
 pointer-events:none;
}

.opened .garden{
 opacity:1;
 transform:translateY(0) scale(1);
}

/* Tallos */
.stem{
 fill:none;
 stroke:#78916d;
 stroke-width:4;
 stroke-linecap:round;
 stroke-dasharray:300;
 stroke-dashoffset:300;
}

.opened .stem{
 animation:grow 2s ease forwards;
}

@keyframes grow{
 to{stroke-dashoffset:0}
}

/* Hojas */
.leaf{
 fill:#718d70;
 opacity:0;
}

.opened .leaf{
 animation:leaf 1s ease forwards;
}

@keyframes leaf{
 to{opacity:1}
}

/* Flores */
.flower{
 opacity:0;
}

.opened .flower{
 animation:bloom 1s ease forwards;
}

@keyframes bloom{
 from{opacity:0}
 to{opacity:1}
}

/* Pétalos */
.petal{
 fill:#a77bc9;
 stroke:#d9b8ed;
 stroke-width:1.3;
}

.light{fill:#c49cdd}
.dark{fill:#8054a8}
.center{fill:#f2d9a5}

/* Envoltorio */
.wrap{
 fill:#c6a8d4;
 stroke:#e9d8ef;
 stroke-width:1.5;
}

.ribbon{
 fill:none;
 stroke:#e9d5ef;
 stroke-width:4;
 stroke-linecap:round;
}

/* Violetas flotantes */
.falling{
 position:fixed;
 inset:0;
 pointer-events:none;
}

.falling span{
 position:absolute;
 bottom:-20px;
 color:#bd91d6;
 opacity:0;
}

.opened .falling span{
 animation:fall 9s linear infinite;
}

.falling span:nth-child(1){left:10%;animation-delay:0s}
.falling span:nth-child(2){left:28%;animation-delay:2s}
.falling span:nth-child(3){left:78%;animation-delay:1s}
.falling span:nth-child(4){left:90%;animation-delay:3s}
.falling span:nth-child(5){left:55%;animation-delay:4s}

@keyframes fall{
 10%{opacity:.8}
 100%{
  transform:translateY(-110vh) rotate(300deg);
  opacity:0;
 }
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>
