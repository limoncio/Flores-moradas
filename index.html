
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un ramo para ti</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 75%, #342344 0%, #1b1426 48%, #0b0911 100%);
  font-family: Georgia, serif;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 100%),
    radial-gradient(1px 1px at 25% 72%, #fff 50%, transparent 100%),
    radial-gradient(2px 2px at 78% 20%, #fff 50%, transparent 100%),
    radial-gradient(1px 1px at 88% 65%, #fff 50%, transparent 100%),
    radial-gradient(2px 2px at 60% 48%, #fff 50%, transparent 100%),
    radial-gradient(1px 1px at 42% 12%, #fff 50%, transparent 100%),
    radial-gradient(1px 1px at 8% 85%, #fff 50%, transparent 100%);
  opacity: .65;
}

#reveal {
  position: absolute;
  z-index: 5;
  border: 1px solid #c5a3e2;
  border-radius: 40px;
  padding: 16px 32px;
  background: linear-gradient(135deg, #56366f, #352044);
  color: #fff;
  font-family: Georgia, serif;
  font-size: 17px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 30px #a77acb55;
  transition: .5s;
}

#reveal:hover {
  transform: scale(1.06);
  box-shadow: 0 0 40px #b98bdf88;
}

#scene {
  width: min(94vw, 650px);
  height: min(88vh, 700px);
  opacity: 0;
  transform: translateY(25px) scale(.94);
  transition: opacity 1.3s ease, transform 1.3s ease;
  pointer-events: none;
}

#scene.opened {
  opacity: 1;
  transform: translateY(0) scale(1);
}

svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Papel del ramo */
.paper {
  opacity: 0;
  transform-origin: center;
}

.opened .paper {
  animation: appear 1.2s ease forwards .8s;
}

.paper-shadow {
  fill: #00000025;
}

.paper-main {
  fill: url(#paperGradient);
  stroke: #e5d4ee;
  stroke-width: 2;
}

.paper-fold {
  fill: none;
  stroke: #f2e6f8;
  stroke-width: 2;
  opacity: .45;
}

/* Tallos */
.stem {
  fill: none;
  stroke: #63864e;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
}

.opened .stem {
  animation: grow 1.8s ease forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

/* Hojas */
.leaf {
  fill: #658b54;
  stroke: #3e633b;
  stroke-width: 1.5;
  opacity: 0;
}

.opened .leaf {
  animation: appear .8s ease forwards 1.2s;
}

/* Flores */
.flower {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(.1);
}

.opened .flower {
  animation: bloom 1.1s cubic-bezier(.2,.8,.3,1.2) forwards;
}

.opened .f1 { animation-delay: .5s; }
.opened .f2 { animation-delay: .7s; }
.opened .f3 { animation-delay: .9s; }
.opened .f4 { animation-delay: 1.1s; }
.opened .f5 { animation-delay: 1.3s; }
.opened .f6 { animation-delay: 1.5s; }
.opened .f7 { animation-delay: 1.7s; }
.opened .f8 { animation-delay: 1.9s; }
.opened .f9 { animation-delay: 2.1s; }

@keyframes bloom {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(-25deg);
  }
  75% {
    opacity: 1;
    transform: scale(1.12) rotate(5deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

.petal {
  fill: #9870c1;
  stroke: #c7a5e5;
  stroke-width: 1.5;
}

.petal-light {
  fill: #b18bd5;
  stroke: #d9bcec;
  stroke-width: 1.5;
}

.flower-center {
  fill: #f2d48a;
  stroke: #fff0bd;
  stroke-width: 1.5;
}

/* Lazo */
.bow {
  opacity: 0;
}

.opened .bow {
  animation: appear .9s ease forwards 2s;
}

@keyframes appear {
  to { opacity: 1; }
}

/* Audio invisible */
audio {
  display: none;
}
</style>
</head>

<body>

<div class="stars"></div>

<button id="reveal">Abrir sorpresa ✿</button>

<!-- Música de fondo -->
<audio id="music" src="musica.mp3" loop preload="none"></audio>

<div id="scene">
<svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="paperGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e9d9f0"/>
    <stop offset="45%" stop-color="#c3a6d3"/>
    <stop offset="100%" stop-color="#9878aa"/>
  </linearGradient>

  <g id="violet">
    <ellipse class="petal-light" cx="0" cy="-19" rx="11" ry="19"/>
    <ellipse class="petal" cx="18" cy="-6" rx="11" ry="19" transform="rotate(72 18 -6)"/>
    <ellipse class="petal-light" cx="11" cy="15" rx="11" ry="19" transform="rotate(144 11 15)"/>
    <ellipse class="petal" cx="-11" cy="15" rx="11" ry="19" transform="rotate(216 -11 15)"/>
    <ellipse class="petal-light" cx="-18" cy="-6" rx="11" ry="19" transform="rotate(288 -18 -6)"/>
    <circle class="flower-center" cx="0" cy="0" r="6"/>
  </g>
</defs>

<!-- Envoltorio de papel -->
<g class="paper">
  <path class="paper-shadow"
    d="M100 360 Q300 425 500 360 L390 570 Q300 625 210 570 Z"
    transform="translate(0 7)"/>

  <path class="paper-main"
    d="M100 360 Q300 425 500 360 L390 570 Q300 625 210 570 Z"/>

  <path class="paper-fold"
    d="M100 360 Q190 465 300 615"/>

  <path class="paper-fold"
    d="M500 360 Q410 465 300 615"/>

  <path class="paper-fold"
    d="M175 390 Q245 490 270 590"
    opacity=".3"/>

  <path class="paper-fold"
    d="M425 390 Q355 490 330 590"
    opacity=".3"/>
</g>

<!-- Tallos -->
<g>
  <path class="stem" d="M300 170 Q300 350 300 515"/>
  <path class="stem" d="M240 205 Q250 360 290 515"/>
  <path class="stem" d="M360 205 Q350 360 310 515"/>
  <path class="stem" d="M185 255 Q220 370 280 515"/>
  <path class="stem" d="M415 255 Q380 370 320 515"/>
  <path class="stem" d="M260 285 Q270 400 295 515"/>
  <path class="stem" d="M340 285 Q330 400 305 515"/>
  <path class="stem" d="M220 320 Q245 420 290 515"/>
  <path class="stem" d="M380 320 Q355 420 310 515"/>
</g>

<!-- Hojas -->
<g>
  <path class="leaf" d="M260 390 Q210 350 205 385 Q225 415 260 390"/>
  <path class="leaf" d="M340 405 Q390 365 395 400 Q370 430 340 405"/>
  <path class="leaf" d="M240 445 Q190 410 190 445 Q215 470 240 445"/>
  <path class="leaf" d="M360 450 Q410 415 415 450 Q390 475 360 450"/>
  <path class="leaf" d="M280 465 Q245 435 240 465 Q260 490 280 465"/>
  <path class="leaf" d="M320 470 Q355 435 360 465 Q340 490 320 470"/>
</g>

<!-- Nueve flores -->
<g class="flower f1" transform="translate(300 145) scale(1.2)">
  <use href="#violet"/>
</g>
<g class="flower f2" transform="translate(240 190) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f3" transform="translate(360 190) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f4" transform="translate(185 245) scale(1)">
  <use href="#violet"/>
</g>
<g class="flower f5" transform="translate(415 245) scale(1)">
  <use href="#violet"/>
</g>
<g class="flower f6" transform="translate(260 275) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f7" transform="translate(340 275) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f8" transform="translate(220 315) scale(.9)">
  <use href="#violet"/>
</g>
<g class="flower f9" transform="translate(380 315) scale(.9)">
  <use href="#violet"/>
</g>

<!-- Lazo del ramo -->
<g class="bow">
  <path d="M300 500
    C270 465 220 465 225 500
    C230 530 270 525 300 500
    C330 525 370 530 375 500
    C380 465 330 465 300 500 Z"
    fill="#a17abd" stroke="#e0c5ef" stroke-width="2"/>

  <path d="M300 500 L275 555 L300 542 L325 555 Z"
    fill="#9870b6" stroke="#e0c5ef" stroke-width="2"/>

  <ellipse cx="300" cy="500" rx="11" ry="13"
    fill="#d5b5e9" stroke="#f2e4fa" stroke-width="2"/>
</g>

</svg>
</div>

<script>
const button = document.getElementById("reveal");
const scene = document.getElementById("scene");
const music = document.getElementById("music");

button.addEventListener("click", async () => {
  scene.classList.add("opened");

  button.style.opacity = "0";
  button.style.transform = "scale(.8)";
  button.style.pointerEvents = "none";

  music.volume = 0.15;

  try {
    await music.play();
  } catch (error) {
    console.log("No se ha podido iniciar la música:", error);
  }
}, { once: true });
</script>

</body>
</html>
