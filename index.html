
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#190f20">
<title>Violetas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 40%, #49304f, #26152f 55%, #110b18);
}

/* ESTRELLAS */

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 15% 20%, #fff 98%, transparent),
    radial-gradient(2px 2px at 80% 15%, #e9d8ff 98%, transparent),
    radial-gradient(2px 2px at 75% 75%, #fff 98%, transparent),
    radial-gradient(2px 2px at 25% 70%, #fff 98%, transparent),
    radial-gradient(2px 2px at 50% 10%, #fff 98%, transparent),
    radial-gradient(2px 2px at 90% 55%, #fff 98%, transparent);
  opacity: .6;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  to { opacity: .2; }
}

/* ESCENA */

main {
  position: relative;
  width: 100%;
  height: 100vh;
  display: grid;
  place-items: center;
}

.intro {
  position: absolute;
  z-index: 5;
  transition: 1s;
}

.seal {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 1px solid #d9b9e8;
  background: #ffffff0b;
  color: #e7c9f5;
  font-size: 38px;
  cursor: pointer;
  box-shadow: 0 0 35px #bd8ede55;
  animation: pulse 2.5s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.1);
    box-shadow: 0 0 55px #bd8ede88;
  }
}

/* RAMO */

.garden {
  position: absolute;
  width: min(96vw, 580px);
  opacity: 0;
  transform: translateY(30px) scale(.85);
  transition: 1.5s cubic-bezier(.2,.8,.2,1);
}

.garden svg {
  display: block;
  width: 100%;
  height: auto;
}

.opened .intro {
  opacity: 0;
  transform: scale(.4);
  pointer-events: none;
}

.opened .garden {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* TALLOS */

.stem {
  fill: none;
  stroke: #78916d;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
}

.opened .stem {
  animation: grow 2s ease forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

/* HOJAS */

.leaf {
  fill: #78916d;
  opacity: 0;
}

.opened .leaf {
  animation: leaf 1s ease forwards;
}

@keyframes leaf {
  to { opacity: 1; }
}

/* FLORES */

.flower {
  opacity: 0;
}

.opened .flower {
  animation: bloom 1s ease forwards;
}

@keyframes bloom {
  from { opacity: 0; }
  to { opacity: 1; }
}

.petal {
  fill: #a77bc9;
  stroke: #dfc2ef;
  stroke-width: 1.4;
}

.petal.light {
  fill: #c69bdd;
}

.petal.dark {
  fill: #8052a9;
}

.center {
  fill: #f5dfaa;
}

/* PAPEL DE FLORISTERÍA */

.paper {
  fill: #c7a7d5;
  stroke: #ead8f2;
  stroke-width: 2;
  stroke-linejoin: round;
}

.paper-left {
  fill: #e0c9e9;
  stroke: #ead8f2;
  stroke-width: 1.5;
}

.paper-right {
  fill: #a987bd;
  stroke: #ead8f2;
  stroke-width: 1.5;
}

.paper-detail {
  fill: none;
  stroke: #f5e8fa;
  stroke-width: 2;
  opacity: .8;
  stroke-linecap: round;
}

/* LAZO */

.ribbon {
  fill: none;
  stroke: #f5e0fa;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ribbon-shadow {
  fill: none;
  stroke: #a982bc;
  stroke-width: 2;
  opacity: .6;
}

.ribbon-center {
  fill: #f5e0fa;
  stroke: #b990ca;
  stroke-width: 2;
}

/* PÉTALOS FLOTANTES */

.falling {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.falling span {
  position: absolute;
  bottom: -30px;
  color: #c49cdd;
  opacity: 0;
  font-size: 19px;
}

.opened .falling span {
  animation: fall 10s linear infinite;
}

.falling span:nth-child(1) {
  left: 10%;
  animation-delay: 0s;
}

.falling span:nth-child(2) {
  left: 30%;
  animation-delay: 2s;
}

.falling span:nth-child(3) {
  left: 75%;
  animation-delay: 1s;
}

.falling span:nth-child(4) {
  left: 90%;
  animation-delay: 3s;
}

.falling span:nth-child(5) {
  left: 55%;
  animation-delay: 4s;
}

@keyframes fall {
  10% { opacity: .8; }
  100% {
    transform: translateY(-110vh) rotate(300deg);
    opacity: 0;
  }
}

@media (max-width: 500px) {
  .garden {
    width: 100vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<main id="scene">

  <!-- SORPRESA INICIAL -->

  <div class="intro">
    <button class="seal" id="reveal" aria-label="Descubrir">
      ✿
    </button>
  </div>

  <!-- RAMO -->

  <div class="garden">

    <svg viewBox="0 0 500 570"

      <!-- TALLOS QUE SE UNEN -->

      <g>
        <path class="stem" d="M250 445 Q175 300 85 125"/>
        <path class="stem" d="M250 445 Q195 290 145 85"/>
        <path class="stem" d="M250 445 Q225 270 215 65"/>
        <path class="stem" d="M250 445 Q280 275 285 90"/>
        <path class="stem" d="M250 445 Q325 310 385 140"/>
        <path class="stem" d="M250 445 Q165 350 65 220"/>
        <path class="stem" d="M250 445 Q335 350 435 220"/>
        <path class="stem" d="M250 445 Q205 350 140 210"/>
        <path class="stem" d="M250 445 Q300 350 360 210"/>
      </g>

      <!-- HOJAS -->

      <g>
        <path class="leaf" style="animation-delay:.8s"
          d="M180 340 Q110 295 120 260 Q170 275 180 340Z"/>

        <path class="leaf" style="animation-delay:1s"
          d="M320 340 Q390 290 385 255 Q330 275 320 340Z"/>

        <path class="leaf" style="animation-delay:1.2s"
          d="M210 390 Q145 365 135 325 Q185 330 210 390Z"/>

        <path class="leaf" style="animation-delay:1.4s"
          d="M290 390 Q355 365 370 325 Q320 330 290 390Z"/>

        <path class="leaf" style="animation-delay:1.6s"
          d="M190 270 Q155 235 160 205 Q200 225 190 270Z"/>

        <path class="leaf" style="animation-delay:1.8s"
          d="M310 270 Q345 235 340 205 Q300 225 310 270Z"/>
      </g>

      <!-- PAPEL PRINCIPAL: CONO DE FLORISTERÍA -->

      <g>

        <!-- Silueta exterior: ancho arriba, estrecho abajo -->
        <path class="paper"
          d="M100 300
             Q250 355 400 300
             L285 465
             Q250 505 215 465
             Z"/>

        <!-- Ala izquierda -->
        <path class="paper-left"
          d="M100 300
             Q145 350 215 465
             L198 445
             Q145 360 100 300Z"/>

        <!-- Ala derecha -->
        <path class="paper-right"
          d="M400 300
             Q355 350 285 465
             L302 445
             Q355 360 400 300Z"/>

        <!-- Puntas del papel -->
        <path class="paper-detail"
          d="M100 300 Q250 355 400 300"/>

        <path class="paper-detail"
          d="M145 350 Q180 400 215 465"/>

        <path class="paper-detail"
          d="M355 350 Q320 400 285 465"/>

        <path class="paper-detail"
          d="M225 475 Q250 490 275 475"/>

        <!-- Banda de satén -->
        <path d="M202 410 Q250 430 298 410"
          fill="none"
          stroke="#f6e5fa"
          stroke-width="10"
          stroke-linecap="round"/>

        <!-- Lazo izquierdo -->
        <path class="ribbon-shadow"
          d="M250 425 Q205 380 178 407 Q165 438 246 432"/>

        <path class="ribbon"
          d="M250 425 Q205 380 178 407 Q165 438 246 432"/>

        <!-- Lazo derecho -->
        <path class="ribbon-shadow"
          d="M250 425 Q295 380 322 407 Q335 438 254 432"/>

        <path class="ribbon"
          d="M250 425 Q295 380 322 407 Q335 438 254 432"/>

        <!-- Colas del lazo -->
        <path class="ribbon"
          d="M246 432 Q220 470 202 458"/>

        <path class="ribbon"
          d="M254 432 Q280 470 298 458"/>

        <!-- Centro del lazo -->
        <circle class="ribbon-center"
          cx="250" cy="428" r="10"/>

      </g>

      <!-- NUEVE FLORES -->

      <g class="flower"
         style="animation-delay:1s"
         transform="translate(85 125) scale(1.05)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:1.3s"
         transform="translate(145 85) scale(.95)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:1.6s"
         transform="translate(215 65) scale(1.15)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:1.9s"
         transform="translate(285 90) scale(1)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:2.2s"
         transform="translate(385 140) scale(1.05)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:2.5s"
         transform="translate(65 220) scale(.85)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:2.8s"
         transform="translate(435 220) scale(.85)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:3.1s"
         transform="translate(140 210) scale(.9)">
        <use href="#violet"/>
      </g>

      <g class="flower"
         style="animation-delay:3.4s"
         transform="translate(360 210) scale(.9)">
        <use href="#violet"/>
      </g>

    </svg>

  </div>

  <!-- PÉTALOS FLOTANTES -->

  <div class="falling" aria-hidden="true">
    <span>✿</span>
    <span>✿</span>
    <span>✿</span>
    <span>✿</span>
    <span>✿</span>
  </div>

</main>

<script>
document.getElementById("reveal").addEventListener("click", function() {
  document.getElementById("scene").classList.add("opened");
}, { once: true });
</script>

</body>
</html>
