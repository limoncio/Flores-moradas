
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores moradas</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 85%, #302044 0%, #171020 50%, #090710 100%);
  font-family: Georgia, serif;
  color: white;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 10% 20%, #ffffff80 50%, transparent 100%),
    radial-gradient(1px 1px at 30% 70%, #ffffff90 50%, transparent 100%),
    radial-gradient(2px 2px at 70% 15%, #ffffff70 50%, transparent 100%),
    radial-gradient(1px 1px at 85% 60%, #ffffff80 50%, transparent 100%),
    radial-gradient(2px 2px at 55% 45%, #ffffff70 50%, transparent 100%),
    radial-gradient(1px 1px at 20% 90%, #ffffff90 50%, transparent 100%);
  opacity: .8;
}

#reveal {
  position: relative;
  z-index: 5;
  padding: 16px 30px;
  border: 1px solid #b99ad8;
  border-radius: 30px;
  color: #f3e8ff;
  background: #38254b;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 25px #a46bd455;
  transition: .4s;
}

#reveal:hover {
  transform: scale(1.07);
  background: #51346c;
}

#scene {
  position: absolute;
  width: min(95vw, 650px);
  height: min(90vh, 680px);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transform: translateY(30px) scale(.9);
  pointer-events: none;
  transition: opacity 1.2s ease, transform 1.2s ease;
}

#scene.opened {
  opacity: 1;
  transform: translateY(0) scale(1);
}

#scene svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.flower {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 0;
  transform: scale(.1);
}

.opened .flower {
  animation: bloom 1.2s ease forwards;
}

.opened .f1 { animation-delay: .5s; }
.opened .f2 { animation-delay: .7s; }
.opened .f3 { animation-delay: .9s; }
.opened .f4 { animation-delay: 1.1s; }
.opened .f5 { animation-delay: 1.3s; }
.opened .f6 { animation-delay: 1.5s; }
.opened .f7 { animation-delay: 1.7s; }
.opened .f8 { animation-delay: 1.9s; }
.opened .f9 { animation-delay: 2.1s; }

@keyframes bloom {
  0% { opacity: 0; transform: scale(.1) rotate(-20deg); }
  70% { opacity: 1; transform: scale(1.12) rotate(5deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

.stem {
  stroke: #557b48;
  stroke-width: 5;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
}

.opened .stem {
  animation: grow 1.8s ease forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

.leaf {
  fill: #648b55;
  stroke: #3c6039;
  stroke-width: 2;
  opacity: 0;
}

.opened .leaf {
  animation: leafIn 1s ease forwards;
  animation-delay: 1.2s;
}

@keyframes leafIn {
  to { opacity: 1; }
}

.petals {
  fill: #9163bd;
  stroke: #c7a2e8;
  stroke-width: 1.5;
}

.center {
  fill: #f2d58a;
  stroke: #fff0b8;
  stroke-width: 1;
}

/* Envoltorio de papel */
.wrapper {
  fill: url(#paper);
  stroke: #c5a5d7;
  stroke-width: 2;
  opacity: 0;
}

.opened .wrapper {
  animation: paperIn 1.5s ease forwards;
  animation-delay: .8s;
}

@keyframes paperIn {
  to { opacity: 1; }
}

.ribbon {
  fill: #a47bc3;
  stroke: #d5b8e9;
  stroke-width: 2;
  opacity: 0;
}

.opened .ribbon {
  animation: paperIn 1s ease forwards;
  animation-delay: 1.8s;
}

#music-player {
  position: fixed;
  width: 200px;
  height: 200px;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 15px #0008;
}

#music-player:empty {
  display: none;
}

@media (max-width: 500px) {
  #music-player {
    width: 200px;
    height: 200px;
    right: 8px;
    bottom: 8px;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<button id="reveal">Abrir sorpresa ✿</button>

<div id="scene">
<svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e5d5ed"/>
    <stop offset="50%" stop-color="#b99bc9"/>
    <stop offset="100%" stop-color="#80618f"/>
  </linearGradient>

  <g id="violet">
    <ellipse class="petals" cx="0" cy="-22" rx="12" ry="21"/>
    <ellipse class="petals" cx="21" cy="-7" rx="12" ry="21" transform="rotate(72 21 -7)"/>
    <ellipse class="petals" cx="13" cy="18" rx="12" ry="21" transform="rotate(144 13 18)"/>
    <ellipse class="petals" cx="-13" cy="18" rx="12" ry="21" transform="rotate(216 -13 18)"/>
    <ellipse class="petals" cx="-21" cy="-7" rx="12" ry="21" transform="rotate(288 -21 -7)"/>
    <circle class="center" cx="0" cy="0" r="7"/>
  </g>
</defs>

<!-- Tallos -->
<g>
  <path class="stem" d="M300 270 Q300 380 300 510"/>
  <path class="stem" d="M300 260 Q260 370 270 510"/>
  <path class="stem" d="M300 260 Q340 370 330 510"/>
  <path class="stem" d="M300 250 Q220 350 235 510"/>
  <path class="stem" d="M300 250 Q380 350 365 510"/>
  <path class="stem" d="M300 250 Q190 360 205 510"/>
  <path class="stem" d="M300 250 Q410 360 395 510"/>
  <path class="stem" d="M300 240 Q245 330 250 510"/>
  <path class="stem" d="M300 240 Q355 330 350 510"/>
</g>

<!-- Hojas -->
<g>
  <path class="leaf" d="M270 390 Q220 350 220 390 Q240 420 270 390"/>
  <path class="leaf" d="M330 410 Q380 370 380 410 Q355 435 330 410"/>
  <path class="leaf" d="M245 445 Q200 410 195 445 Q220 470 245 445"/>
  <path class="leaf" d="M355 455 Q405 420 410 455 Q385 480 355 455"/>
  <path class="leaf" d="M285 470 Q250 440 250 475 Q270 495 285 470"/>
  <path class="leaf" d="M320 475 Q350 440 355 475 Q335 495 320 475"/>
</g>

<!-- Envoltorio de ramo, con punta inferior -->
<path class="wrapper"
  d="M125 355
     Q180 390 230 405
     Q300 425 370 405
     Q420 390 475 355
     L420 520
     Q365 585 300 610
     Q235 585 180 520 Z"/>

<!-- Pliegues del papel -->
<path d="M125 355 Q210 440 300 610"
  fill="none" stroke="#e8d9ef" stroke-width="2" opacity=".5"/>
<path d="M475 355 Q390 440 300 610"
  fill="none" stroke="#6f527d" stroke-width="2" opacity=".4"/>

<!-- Flores -->
<g class="flower f1" transform="translate(300 180) scale(1.25)">
  <use href="#violet"/>
</g>
<g class="flower f2" transform="translate(240 205) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f3" transform="translate(360 205) scale(1.05)">
  <use href="#violet"/>
</g>
<g class="flower f4" transform="translate(185 255) scale(.95)">
  <use href="#violet"/>
</g>
<g class="flower f5" transform="translate(415 255) scale(.95)">
  <use href="#violet"/>
</g>
<g class="flower f6" transform="translate(260 285) scale(1)">
  <use href="#violet"/>
</g>
<g class="flower f7" transform="translate(340 285) scale(1)">
  <use href="#violet"/>
</g>
<g class="flower f8" transform="translate(220 320) scale(.85)">
  <use href="#violet"/>
</g>
<g class="flower f9" transform="translate(380 320) scale(.85)">
  <use href="#violet"/>
</g>

<!-- Lazo -->
<g class="ribbon">
  <path d="M300 500
    C260 455 205 470 235 510
    C250 530 280 520 300 500
    C320 520 350 530 365 510
    C395 470 340 455 300 500 Z"/>
  <path d="M300 500 L275 555 L300 545 L325 555 Z"/>
  <circle cx="300" cy="500" r="10" fill="#d8b8e9"/>
</g>

</svg>
</div>

<div id="music-player"></div>

<script>
const button = document.getElementById("reveal");
const scene = document.getElementById("scene");

let playerCreated = false;

button.addEventListener("click", function () {
  scene.classList.add("opened");
  button.style.opacity = "0";
  button.style.pointerEvents = "none";

  if (playerCreated) return;
  playerCreated = true;

  // Cargar el reproductor oficial de YouTube
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
});

function onYouTubeIframeAPIReady() {
  new YT.Player("music-player", {
    width: "200",
    height: "200",
    videoId: "rJgNgZRCi6s",
    playerVars: {
      autoplay: 1,
      controls: 0,
      loop: 1,
      playlist: "rJgNgZRCi6s",
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function(event) {
        event.target.setVolume(15);
        event.target.playVideo();
      }
    }
  });
}
</script>

</body>
</html>
